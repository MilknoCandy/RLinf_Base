defaults:
  - env/robotwin_aloha_pi05@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # `all` follows visible GPUs (explorer 2-GPU = 0-1; MTP 8-GPU = 0-7).
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_openpi_pi05_eval"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  enable_offload: True
  eval:
    rollout_epoch: 1
    total_num_envs: 8
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 400
    reward_coef: 1.0
    max_steps_per_rollout_epoch: 400
    group_size: 1
    use_fixed_reset_state_ids: False
    use_custom_reward: False
    is_eval: True
    assets_path: ${oc.env:ROBOTWIN_PATH,/path/to/RoboTwin}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: False
    task_config:
      task_name: adjust_bottle
      step_lim: 400
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1
  model:
    # Point at an OpenPI π₀.₅ RoboTwin checkpoint (50-task co-train, or an
    # RLinf SFT ``global_step_<N>`` directory). Do not use the single-task
    # ``RLinf-Pi05-RoboTwin-SFT-adjust_bottle`` weights for a 50-task sweep.
    model_path: "/path/to/pi05_robotwin_openpi"
    num_action_chunks: 50
    action_dim: 14
    add_value_head: False
    num_steps: 5
    # JAX AgileX co-train (pi05jax_robotwin): no Trossen joint-flip / gripper
    # angular map. pi05_aloha_robotwin defaults adapt_to_pi=True (that default
    # is for RLinf's own pi05 SFT). Override via EXTRA_OVERRIDES if needed.
    openpi_data:
      adapt_to_pi: false
      extra_delta_transform: true
      norm_stats_path: ${..model_path}/physical-intelligence/robotwin/norm_stats.json
    openpi:
      task: eval
      config_name: "pi05_aloha_robotwin"
      num_images_in_input: 3
      noise_level: 0.3
      detach_critic_input: True
