defaults:
  - metaworld_50_rlt_stage2_zap
  - _self_

runner:
  logger:
    experiment_name: "metaworld_50_rlt_stage2_qc"

algorithm:
  # Online Q-chunking on RLT Stage 2 (no offline critic pretrain).
  loss_type: rlt_qc
  n_step: 1
  qc_num_samples: 8
  qc_include_ref_chunk: True
  qc_include_actor_mean: True
  rlt_phase_gate:
    mode: vlm

actor:
  model:
    action_extract: best_of_n
    qc_num_samples: 8
    qc_include_ref_chunk: True
    qc_include_actor_mean: True

rollout:
  model:
    action_extract: best_of_n
    qc_num_samples: 8
    qc_include_ref_chunk: True
    qc_include_actor_mean: True
