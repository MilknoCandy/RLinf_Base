defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout, actor: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_pro_bowl_erlt_openpi_pi05"
    logger_backends: ["wandb"]

  # Appendix C.5 is the LIBERO online budget that states an epoch count: 100.
  # Epochs 1-8 only collect. Epoch 9 is the first update (16 envs x 9 = 144
  # trajectories). Each later epoch does 200 replay updates.
  max_epochs: 100
  max_steps: -1
  only_eval: False
  val_check_interval: 20
  save_interval: 20
  weight_sync_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  # One routing update per epoch: the 200th learner step.
  update_epoch: 200
  erlt_update_interval: 200
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  agg_q: mean
  actor_agg_q: mean
  backup_entropy: False
  critic_subsample_size: 0
  critic_actor_ratio: 1

  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005

  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 15000
    sample_window_size: 15000
    min_buffer_size: 144
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 144

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    # LIBERO-PRO Bowl Placing is libero_spatial task 9.
    # Launch with LIBERO_TYPE=pro and LIBERO_PRO_PATH set.
    task_id_filter: [9]
    rollout_epoch: 1
    total_num_envs: 16
    seed: 2026
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: False
    use_rel_reward: False
    use_step_penalty: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    action_dim: 7
    num_action_chunks: 10
  eval:
    task_id_filter: [9]
    rollout_epoch: 1
    total_num_envs: 100
    seed: 2026
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    use_rel_reward: False
    use_step_penalty: True
    is_eval: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    action_dim: 7
    num_action_chunks: 10
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: "/path/to/pi05_libero"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 256
  seed: 123
  enable_offload: False

  model:
    model_path: "/path/to/pi05_libero"
    num_action_chunks: 10
    action_dim: 7
    num_steps: 3
    num_q_heads: 10
    add_value_head: False
    add_q_head: True
    q_head_type: "default"

    openpi:
      config_name: "pi05_libero"
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      use_dsrl: True
      use_erlt: True
      erlt_use_probe: False
      erlt_num_tokens: 1
      erlt_hidden_dim: 2048
      erlt_layer_indices: [0, 3, 6, 9, 12, 15, 18]
      erlt_logit_slots: 64
      erlt_temperature: 1.0
      erlt_actor_hidden_dims: [1024, 512, 256]
      # Lowest stage-1 validation MSE. Leave null to keep the router that was
      # stored in model_path.
      erlt_router_path: null
      dsrl_state_dim: 8
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      train_expert_only: True
      detach_critic_input: True
      noise_method: "flow_ode"

  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 3.5

  critic_optim:
    lr: 3.0e-4
    clip_grad: 10.0
    lr_scheduler: torch_constant

  router_optim:
    lr: 3.0e-4
    clip_grad: 10.0
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
