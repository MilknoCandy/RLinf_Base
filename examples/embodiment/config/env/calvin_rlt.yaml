env_type: calvin_rlt
task_suite_name: calvin_abc

total_num_envs: null

auto_reset: False
ignore_terminations: False
use_rel_reward: True
reward_coef: 1.0

seed: 0
group_size: 1
use_fixed_reset_state_ids: False
use_ordered_reset_state_ids: False

is_eval: False

max_steps_per_rollout_epoch: 480
max_episode_steps: 480

rlt_policy_switch:
  enable: True
  task_mode: full_task
  # auto: enter RLT actor once current_task_idx >= min_task_idx (option A).
  # always_on: full-episode actor (ablation / smoke only).
  trigger_mode: auto
  latch_until_done: True
  auto_gate:
    # 0-based subtask index on the 5-step CALVIN chain.
    # idx 0–1: VLA ref_chunk; idx >= 2: RLT actor (latched until reset).
    min_task_idx: 2
  expert_takeover:
    enable: False

video_cfg:
  save_video: False
  info_on_video: True
  fps: 20
  record_every: 1
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  camera_heights: 200
  camera_widths: 200
