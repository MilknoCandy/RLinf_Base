env_type: calvin_rlt
task_suite_name: calvin_abc

total_num_envs: null

auto_reset: False
ignore_terminations: False
use_rel_reward: True
reward_coef: 1.0

seed: 0
group_size: 1
use_fixed_reset_state_ids: False
use_ordered_reset_state_ids: False

is_eval: False

max_steps_per_rollout_epoch: 480
max_episode_steps: 480

rlt_policy_switch:
  enable: True
  task_mode: full_task
  trigger_mode: always_on
  latch_until_done: True
  expert_takeover:
    enable: False
    # CALVIN has no peg-hole geometry, so "stalled progress" is defined by
    # subtask progress: current_task_idx stops advancing for several action
    # chunks while the episode is still running. ``always_on`` and
    # ``critical_phase`` are also supported for ablations.
    trigger_mode: stalled_progress
    gate:
      stuck_chunks_before_takeover: 3

video_cfg:
  save_video: False
  info_on_video: True
  fps: 20
  record_every: 1
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  camera_heights: 200
  camera_widths: 200
