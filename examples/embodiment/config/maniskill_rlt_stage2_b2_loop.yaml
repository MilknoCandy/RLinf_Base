# B2 Stage 2: freeze VLM/VLA, continue Stage 1 encoder as a Loop, train MLP
# from scratch. Replay stores post-VLM I_t (feedback already in the tokens).
#   python examples/embodiment/train_embodied_agent.py --config-name maniskill_rlt_stage2_b2_loop
# Set rollout.rlt_feature_model.model_path (and actor.model.encoder_ckpt) to
# the trained Stage 1 checkpoint. Do not load a Stage 2 MLP checkpoint.

defaults:
  - maniskill_rlt_stage2_ac_mlp
  - _self_

runner:
  logger:
    experiment_name: "maniskill_rlt_stage2_b2_loop"
  ckpt_path: null

actor:
  model:
    rlt_loop: True
    encoder_ckpt: ${rollout.rlt_feature_model.model_path}
    rlt_input_dim: 2048
    rlt_embed_dim: 2048
    rlt_prefix_seq_len: 1024
    rlt_num_layers: 2
    rlt_num_heads: 8
    rlt_mlp_ratio: 4.0
    rlt_dropout_rate: 0.0

rollout:
  model:
    rlt_loop: True
    encoder_ckpt: ${rollout.rlt_feature_model.model_path}
    rlt_input_dim: ${actor.model.rlt_input_dim}
    rlt_embed_dim: ${actor.model.rlt_embed_dim}
    rlt_prefix_seq_len: ${actor.model.rlt_prefix_seq_len}
    rlt_num_layers: ${actor.model.rlt_num_layers}
    rlt_num_heads: ${actor.model.rlt_num_heads}
    rlt_mlp_ratio: ${actor.model.rlt_mlp_ratio}
    rlt_dropout_rate: ${actor.model.rlt_dropout_rate}
  rlt_feature_model:
    openpi:
      rlt_b2: True
      rlt_b2_image_keep_ratio: 0.5
      rlt_image_only: True
      rlt_use_mask: True
