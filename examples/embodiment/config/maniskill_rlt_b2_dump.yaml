# Dump sequential encoder inputs I_t along trained Stage 1 + Stage 2 RLT.
# Execution matches those checkpoints: instruction-only VLM prompt, VLA
# ref_chunk + MLP residual. Do not add B2 feedback sentences or Loop z;
# Stage 1/2 never saw them, and using them at dump time shifts the policy.
# I_t is TopK image tokens from that same in-distribution prefix.
#   bash evaluations/run_eval.sh maniskill maniskill_rlt_b2_dump
# Set runner.ckpt_path to the trained Stage 2 actor, and
# rollout.rlt_feature_model.model_path to the trained Stage 1 checkpoint.

defaults:
  - maniskill_rlt_stage2_ac_mlp
  - _self_

algorithm:
  rlt_schedule:
    enable: False

runner:
  task_type: embodied_eval
  only_eval: True
  max_epochs: 1
  val_check_interval: 1
  ckpt_path: "/path/to/maniskill_rlt_stage2_ac_mlp/checkpoints/global_step_<step>/actor"
  logger:
    experiment_name: "maniskill_rlt_b2_dump"

env:
  eval:
    auto_reset: True
    total_num_envs: 16
    rollout_epoch: 10
    use_fixed_reset_state_ids: False
    rlt_policy_switch:
      expert_takeover:
        enable: False

rollout:
  collect_transitions: False
  rlt_b2_dump_dir: "../results/rlt_b2_dump"
