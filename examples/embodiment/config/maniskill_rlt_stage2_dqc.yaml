defaults:
  - maniskill_rlt_stage2_qc
  - _self_

runner:
  logger:
    experiment_name: "maniskill_rlt_stage2_dqc"

algorithm:
  # Decoupled Q-chunking: critic horizon 30 env steps, policy chunk 10.
  loss_type: rlt_dqc
  n_step: 1
  dqc_backup_horizon: 30
  dqc_kappa_d: 0.9
  dqc_kappa_b: 0.9

actor:
  model:
    action_extract: best_of_n
    chunk_critic_steps: 30

rollout:
  model:
    action_extract: best_of_n
    chunk_critic_steps: 30
