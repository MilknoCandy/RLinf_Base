defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: all
    rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_bowl_rlt_stage2_dqc"
    logger_backends: ["wandb"]

  # Table II lists 25 online episodes after ~20 seed corrections.
  # This run has no seed buffer, so the matched total in Appendix D is 45.
  max_epochs: 45
  max_steps: -1
  only_eval: False
  weight_sync_interval: 1
  val_check_interval: 15
  save_interval: 15
  resume_dir: null
  ckpt_path: null

algorithm:
  # Table III: update-to-data ratio 5. One new chunk schedules 5 gradient steps.
  update_epoch: 5
  rlt_schedule:
    enable: True
    max_updates_per_train_step: 1024
    warmup_min_size: 256
    # Table III: VLA warmup before handover is 5 weight syncs.
    warmup_post_collect_updates: 5
    train_every_episodes: 0
    train_every_transitions: 1
  group_size: 1

  adv_type: embodied_sac
  loss_type: rlt_dqc
  loss_agg_func: "token-mean"

  # One replay row is one action chunk. n_step=1 is the current RLT TD target.
  n_step: 1
  qc_num_samples: 8
  qc_include_ref_chunk: True
  qc_include_actor_mean: True
  dqc_backup_horizon: 15
  dqc_kappa_d: 0.9
  dqc_kappa_b: 0.9
  agg_q: min
  actor_agg_q: q1
  enable_drq: False
  q_head_type: ${actor.model.q_head_type}
  bootstrap_type: standard
  gamma: 0.99
  tau: 0.005

  # Constant anchor. Bee's η is 1; this RLT loss has no ManiSkill BC ramp.
  q_weight: 1.0
  bc_weight: 1.0
  reference_dropout_prob: 0.5

  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 1.0

  replay_buffer:
    enable_cache: True
    cache_size: 256
    sample_window_size: 4096
    max_num_samples: 4096
    min_buffer_size: 256
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 256
  # Table III: 2 critic updates per policy update.
  critic_actor_ratio: 2
  critic_subsample_size: 0
  backup_entropy: False

  rlt_phase_gate:
    mode: none

env:
  group_name: "EnvGroup"
  train:
    # Online env is LIBERO-PRO (perturbations). Demos do not come from PRO.
    # Bowl placing is libero_spatial task 9. Launch with LIBERO_TYPE=pro.
    # One env: one epoch is one episode. Appendix D budget is 45.
    task_id_filter: [9]
    rollout_epoch: 1
    total_num_envs: 1
    seed: 2026
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: False
    use_rel_reward: False
    use_step_penalty: False
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    action_dim: 7
    num_action_chunks: 5
    ref_num_action_chunks: 10
  eval:
    task_id_filter: [9]
    rollout_epoch: 1
    total_num_envs: 16
    seed: 2026
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    use_rel_reward: False
    use_step_penalty: False
    is_eval: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    action_dim: 7
    num_action_chunks: 5
    ref_num_action_chunks: 10
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: True

  model:
    model_type: ${actor.model.model_type}
    model_path: ""
    precision: ${actor.model.precision}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    ref_num_action_chunks: ${actor.model.ref_num_action_chunks}
    z_dim: ${actor.model.z_dim}
    proprio_dim: ${actor.model.proprio_dim}
    add_q_head: ${actor.model.add_q_head}
    q_head_type: ${actor.model.q_head_type}
    action_extract: best_of_n
    qc_num_samples: 8
    qc_include_ref_chunk: True
    qc_include_actor_mean: True
    chunk_critic_steps: 15
    fixed_std: ${actor.model.fixed_std}
    mlp_hidden_dim: ${actor.model.mlp_hidden_dim}
    mlp_num_hidden_layers: ${actor.model.mlp_num_hidden_layers}
    frozen_action_dims: ${actor.model.frozen_action_dims}
    is_lora: False
    lora_rank: 32

  rlt_feature_model:
    model_type: "openpi_rlinf"
    # Stage 1 checkpoint trained on standard LIBERO Spatial bowl demos.
    model_path: "/path/to/libero_spatial_bowl_rlt_stage1_sft_openpi_pi05/checkpoints/global_step_<step>/actor"
    precision: bf16
    num_action_chunks: 10
    action_dim: ${actor.model.action_dim}
    num_steps: 5
    add_value_head: False
    is_lora: False
    lora_rank: 32
    openpi_data:
      # Norm stats / repo must match Stage 1 and pi05_libero.
      # Online prompts come from env task_descriptions, not a fixed string.
      repo_id: "physical-intelligence/libero"
      default_prompt: null
    openpi:
      task: eval
      config_name: "pi05_libero"
      num_images_in_input: 2
      action_chunk: 10
      action_horizon: 10
      action_env_dim: 7
      num_steps: 5
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: False
      train_expert_only: False
      add_value_head: False
      detach_critic_input: True
      use_rlt: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 4
      rlt_num_heads: 16
      rlt_mlp_ratio: 4.0
      rlt_encoder_type: "append_self_attention"
      rlt_image_only: False
      rlt_use_mask: True

  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False

  model:
    model_type: "rlt_mlp_policy"
    precision: fp32
    action_dim: 7
    num_action_chunks: 5
    ref_num_action_chunks: 10
    z_dim: 2048
    # eef xyz + axis-angle + gripper qpos
    proprio_dim: 8
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    action_extract: best_of_n
    qc_num_samples: 8
    qc_include_ref_chunk: True
    qc_include_actor_mean: True
    chunk_critic_steps: 15
    # Table III exploration noise, in normalized action units.
    fixed_std: 0.01
    # Table III: MLP depth 3, width 512. Twin Q, min over heads.
    mlp_hidden_dim: 512
    mlp_num_hidden_layers: 3
    # Pose is edited. Gripper (dim 6) stays on the VLA proposal.
    frozen_action_dims: [6]
    is_lora: False
    lora_rank: 32

  optim:
    clip_grad: 1.0
    lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 1.0
    lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
