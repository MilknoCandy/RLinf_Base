# Long-horizon RLT Stage-2 template for CALVIN.
#
# This is the CALVIN counterpart of `maniskill_rlt_stage2_ac_mlp.yaml`. The
# Stage-2 MLP actor/critic is conditioned on a sliding window of chunk
# summaries (`history`), so it can later be migrated to other true long-horizon
# benchmarks without changing the worker plumbing.
#
# Before running, replace the `rlt_feature_model` checkpoint with a CALVIN
# Stage-1 RLT feature model (an OpenPI model trained with `openpi.use_rlt`).
# TODO(agent): add a CALVIN Stage-1 RLT feature-model config/checkpoint once
# that base policy is available.

defaults:
  - env/calvin_d@env.train
  - env/calvin_d@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: all
    rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "calvin_rlt_lh_stage2_ac_mlp"
    logger_backends: ["tensorboard"]

  max_epochs: 5000
  max_steps: -1
  only_eval: False
  weight_sync_interval: 1
  val_check_interval: 25
  save_interval: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 5
  rlt_schedule:
    enable: True
    max_updates_per_train_step: 400
    warmup_min_size: 10000
    warmup_post_collect_updates: 30000
    train_every_episodes: 0
    train_every_transitions: 5
  group_size: 1

  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: "token-mean"

  agg_q: min
  actor_agg_q: q1
  enable_drq: False
  q_head_type: ${actor.model.q_head_type}
  bootstrap_type: standard
  gamma: 0.96
  tau: 0.005

  q_weight: 1.0
  bc_weight: 1.0
  reference_dropout_prob: 0.5
  actor_weight_schedule:
    enable: True
    warmup_updates: 20000
    ramp_updates: 50000
    warmup_bc_weight: 7.0
    warmup_q_weight: 0.05
    online_bc_weight: 2.5
    online_q_weight: 0.45

  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 10000
    sample_window_size: 50000
    max_num_samples: 50000
    min_buffer_size: 1000
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 1000
  critic_actor_ratio: 4
  critic_subsample_size: 0
  backup_entropy: False

env:
  group_name: "EnvGroup"
  train:
    # Enables the long-horizon RLT path (and auto-enables for `calvin`).
    rlt_long_horizon: True
    rlt_history_window: 8
    rollout_epoch: 8
    total_num_envs: 64
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    auto_reset: False
    ignore_terminations: False
  eval:
    rlt_long_horizon: True
    rlt_history_window: 8
    rollout_epoch: 1
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 9600
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: True

  model:
    model_type: ${actor.model.model_type}
    model_path: ""
    precision: ${actor.model.precision}
    policy_setup: ${actor.model.policy_setup}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    ref_num_action_chunks: ${actor.model.ref_num_action_chunks}
    z_dim: ${actor.model.z_dim}
    proprio_dim: ${actor.model.proprio_dim}
    add_q_head: ${actor.model.add_q_head}
    q_head_type: ${actor.model.q_head_type}
    fixed_std: ${actor.model.fixed_std}
    history_input_dim: ${actor.model.history_input_dim}
    history_hidden_dim: ${actor.model.history_hidden_dim}
    history_num_layers: ${actor.model.history_num_layers}
    is_lora: False
    lora_rank: 32

  rlt_feature_model:
    model_type: "openpi"
    model_path: "/path/to/calvin_rlt_stage1_sft_openpi/checkpoints/global_step_<step>/actor"
    precision: null
    num_action_chunks: 5
    action_dim: 7
    add_value_head: False
    is_lora: False
    lora_rank: 32
    openpi_data:
      repo_id: "placeholder_calvin_rlt"
      default_prompt: "complete the next subtask"
    openpi:
      config_name: "pi05_rlt_calvin"
      num_images_in_input: 2
      action_chunk: 5
      action_horizon: 5
      action_env_dim: 7
      num_steps: 5
      train_expert_only: False
      add_value_head: False
      detach_critic_input: True
      use_rlt: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_num_rl_tokens: 1
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_encoder_type: "append_self_attention"
      rlt_image_only: False
      rlt_use_mask: True

  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 512
  seed: 1234
  enable_offload: False

  model:
    model_type: "rlt_lh_mlp_policy"
    precision: fp32
    policy_setup: "calvin-qpos"
    action_dim: 7
    num_action_chunks: 5
    ref_num_action_chunks: 5
    z_dim: 2048
    proprio_dim: 7
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    fixed_std: 0.002
    # z_dim + proprio_dim + action_dim * num_action_chunks + 3.
    history_input_dim: 2093
    history_hidden_dim: 256
    history_num_layers: 1
    is_lora: False
    lora_rank: 32

  optim:
    clip_grad: 10.0
    lr: 1.0e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 1.0e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
