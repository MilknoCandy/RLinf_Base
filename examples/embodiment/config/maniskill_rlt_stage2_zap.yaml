defaults:
  - maniskill_rlt_stage2_ac_mlp
  - _self_

runner:
  logger:
    experiment_name: "maniskill_rlt_stage2_zap"

algorithm:
  # ZAP: (Z, A) Path metric-gated n-step. Q still takes a single atom.
  loss_type: rlt_zap
  n_step: 1
  za_tau_z: 0.1
  za_tau_a: 0.05
  za_truncate_eps: 0.01
  za_max_horizon: 32
  za_neighbor_k: 32
  za_uniform_entropy_ratio: 0.95
  za_enable_neighbors: True
  # Peg insertion already has geometric rlt_policy_switch flags. Keep the
  # VLM gate off so those env flags decide the precision phase.
  rlt_phase_gate:
    mode: none

rollout:
  rlt_feature_model:
    model_path: "/path/to/maniskill_rlt_stage1_sft_openpi_pi05/checkpoints/global_step_<step>/actor"
