defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout, actor: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_pro_bowl_dsrl_openpi_pi05"
    logger_backends: ["wandb"]

  # Appendix D: DSRL has no seed buffer, so bowl placing is 45 online episodes.
  # One env, so one epoch is one episode.
  max_epochs: 45
  max_steps: -1
  only_eval: False
  val_check_interval: 15
  save_interval: 15
  weight_sync_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 200
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  agg_q: mean
  actor_agg_q: mean
  backup_entropy: False
  critic_subsample_size: 0
  critic_actor_ratio: 1

  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 1.0
    target_entropy: -16
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 15000
    sample_window_size: 15000
    min_buffer_size: 10
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 10

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    # LIBERO-PRO Bowl Placing is libero_spatial task 9.
    # Launch with LIBERO_TYPE=pro and LIBERO_PRO_PATH set.
    task_id_filter: [9]
    rollout_epoch: 1
    total_num_envs: 1
    seed: 2026
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: False
    use_rel_reward: False
    use_step_penalty: False
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    action_dim: 7
    num_action_chunks: 10
  eval:
    # Main text: each reported round is 20 trials.
    task_id_filter: [9]
    rollout_epoch: 1
    total_num_envs: 20
    seed: 2026
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    use_rel_reward: False
    use_step_penalty: False
    is_eval: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    action_dim: 7
    num_action_chunks: 10
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: "/path/to/libero_pro_bowl_rlt_stage1_sft_openpi_pi05/checkpoints/global_step_<step>/actor"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 512
  seed: 42
  enable_offload: False

  model:
    # Same task-specific pi0.5 as RLT stage 1. DSRL does not use the RLT token.
    model_path: "/path/to/libero_pro_bowl_rlt_stage1_sft_openpi_pi05/checkpoints/global_step_<step>/actor"
    # Appendix E: original DSRL chunk-10. Bowl placing's VLA chunk is already 10.
    num_action_chunks: 10
    action_dim: 7
    num_steps: 5
    add_value_head: False
    add_q_head: True
    q_head_type: "default"

    openpi:
      config_name: "pi05_libero"
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      use_dsrl: True
      dsrl_state_dim: 8
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims: [128, 128, 128]
      train_expert_only: True
      detach_critic_input: True
      noise_method: "reinflow"

  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5

  critic_optim:
    lr: 3.0e-4
    clip_grad: 10.0
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
