defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "metaworld_50_rlt_stage1_sft_openpi_pi05"
    logger_backends: ["wandb"]

  max_epochs: -1
  max_steps: 10000
  val_check_interval: -1
  save_interval: 500

data:
  # Same LeRobot corpus used by pi05_metaworld / RLinf Pi05 MetaWorld SFT.
  # https://huggingface.co/datasets/lerobot/metaworld_mt50
  train_data_paths:
    - dataset_path: "lerobot/metaworld_mt50"
      weight: 1.0

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # π0.5 + 4-layer/2048 RLT prefix (1024 tokens) does not fit no_shard + micro=8
  # on 80G. Keep global 256 via accumulation: 256 / (1 * 8 GPUs) = 32 steps.
  micro_batch_size: 1
  global_batch_size: 256
  seed: 0

  model:
    precision: fp32
    # Init from the MetaWorld pi05-SFT prior; Stage 1 trains the RLT encoder.
    # https://huggingface.co/RLinf/RLinf-Pi05-MetaWorld-SFT
    model_path: "/path/to/model/RLinf-Pi05-MetaWorld-SFT"
    model_type: "openpi_rlinf"
    # VLA chunk matches pi05_metaworld.action_horizon.
    num_action_chunks: 5
    action_dim: 4
    add_value_head: False
    num_steps: 5
    openpi:
      task: sft
      config_name: "pi05_metaworld"
      num_images_in_input: 1
      train_expert_only: False
      detach_critic_input: True
      action_horizon: 5
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: False
      use_rlt: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 4
      rlt_num_heads: 16
      rlt_mlp_ratio: 4.0
      rlt_encoder_type: "append_self_attention"
      rlt_image_only: False
      rlt_use_mask: True

    openpi_data:
      repo_id: "lerobot/metaworld_mt50"
      default_prompt: null
      norm_stats_path: null

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
