defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    # Stage 1 is standard LIBERO Spatial demos, not LIBERO-PRO.
    # PRO has no demonstration corpus; it is only the Stage 2 / eval env.
    experiment_name: "libero_spatial_bowl_rlt_stage1_sft_openpi_pi05"
    logger_backends: ["wandb"]

  max_epochs: -1
  max_steps: 2000
  val_check_interval: -1
  save_interval: 250

data:
  # Same LeRobot corpus used by pi05_libero / RLinf Pi05 LIBERO SFT.
  # https://huggingface.co/datasets/physical-intelligence/libero
  # Download locally first, or pass the HF id if your LeRobot cache is set up.
  train_data_paths:
    - dataset_path: "physical-intelligence/libero"
      weight: 1.0

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # π0.5 + 4-layer/2048 RLT prefix (1024 tokens) does not fit no_shard + micro=8
  # on 80G. Keep global 256 via accumulation: 256 / (1 * 8 GPUs) = 32 steps.
  micro_batch_size: 1
  global_batch_size: 256
  seed: 0

  model:
    precision: fp32
    model_path: "/path/to/pi05_base"
    model_type: "openpi_rlinf"
    # VLA chunk matches pi05_libero. Stage 2 executes the first 5 steps.
    num_action_chunks: 10
    action_dim: 7
    add_value_head: False
    num_steps: 5
    openpi:
      task: sft
      config_name: "pi05_libero"
      num_images_in_input: 2
      train_expert_only: False
      detach_critic_input: True
      action_horizon: 10
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: False
      use_rlt: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      # BEE Appendix C: 4-layer encoder and 4-layer decoder, width 2048, 16 heads.
      rlt_num_layers: 4
      rlt_num_heads: 16
      rlt_mlp_ratio: 4.0
      rlt_encoder_type: "append_self_attention"
      rlt_image_only: False
      rlt_use_mask: True

    openpi_data:
      # Must match pi05_libero default and Stage 2 openpi_data.repo_id.
      # Prompts come from each demo's LeRobot task field (prompt_from_task=True).
      repo_id: "physical-intelligence/libero"
      default_prompt: null
      norm_stats_path: null

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 10000
    lr_warmup_steps: 500
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    # openpi sft_forward turns checkpointing off; do not rely on it for memory.
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
