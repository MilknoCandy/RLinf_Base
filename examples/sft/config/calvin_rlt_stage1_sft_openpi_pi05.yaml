defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "calvin_rlt_stage1_sft_openpi_pi05"
    logger_backends: ["tensorboard"]  # wandb, swanlab

  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 5000

data:
  train_data_paths: "/path/to/InternData-Calvin_ABC"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 64
  seed: 0

  model:
    precision: null  # required by official openpi; do not change
    # Start from RLinf's official CALVIN ABC-D Pi0.5 SFT checkpoint instead of
    # pi05_base, so the Stage-1 run only needs to learn the RLT token module.
    model_path: "/path/to/model/RLinf-Pi05-CALVIN-ABC-D-SFT"  # https://huggingface.co/RLinf/RLinf-Pi05-CALVIN-ABC-D-SFT
    model_type: "openpi"  # intentionally not openpi_rlinf; official openpi pipeline
    num_action_chunks: 5
    action_dim: 7
    add_value_head: False
    openpi:
      config_name: "pi05_calvin"
      num_images_in_input: 2
      train_expert_only: False
      detach_critic_input: True
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      use_rlt: True
      # Freeze the already-SFT VLA backbone and train only rlt_module.*.
      freeze_vla_for_rlt: True
      # With the VLA frozen, the VLA loss is reported but contributes no
      # gradient; set alpha to zero so the optimized objective is pure RLT.
      rlt_alpha: 0.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 768
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_image_only: True
      rlt_use_mask: False

    openpi_data:
      repo_id: "/path/to/InternData-Calvin_ABC"
      # pi05_calvin uses prompt_from_task=True; prompts are read from the
      # dataset/task annotations, so there is intentionally no default_prompt.
      norm_stats_path: "/path/to/InternData-Calvin_ABC/norm_stats.json"

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False  # openpi does not support gradient checkpointing
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
